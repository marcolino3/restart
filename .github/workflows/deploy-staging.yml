name: Deploy Staging

on:
  # Automatic on every push to main, plus on-demand from the Actions tab
  # ("Run workflow") or via `gh workflow run deploy-staging.yml`.
  # Production stays manual (workflow_dispatch + approval gate).
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/restart-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/restart-frontend
  NAMESPACE: restart-staging

# Serialisiert Staging-Deploys: bei schnell aufeinanderfolgenden Merges nicht
# zwei Rollouts parallel fahren. Nicht abbrechen (cancel-in-progress: false),
# damit ein laufender Migrate/Rollout den Cluster nicht halbfertig verlässt.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # CI-Gate: lint, test, build, E2E. Schlägt einer fehl, werden gar keine
  # Images gebaut/gepusht und nichts deployed (build hat `needs: [ci]`).
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & Push Images
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # SARIF-Upload aus Trivy-Image-Scan in GitHub Security-Tab.
      security-events: write
    outputs:
      has_kubeconfig: ${{ steps.check.outputs.has_kubeconfig }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if KUBE_CONFIG exists
        id: check
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "has_kubeconfig=true" >> $GITHUB_OUTPUT
          else
            echo "has_kubeconfig=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping deploy - KUBE_CONFIG secret not configured yet"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx mit docker-container-Driver — Voraussetzung für den
      # GitHub-Actions-Layer-Cache (type=gha) der beiden Build-Steps.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            BACKEND_URL=http://backend:3001
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      # Image-Vulnerability-Scan — Deploy schlägt fehl bei fixbarem CRITICAL.
      # Greift NACH dem Push, weil Trivy das pushed Image über GHCR pullt
      # (das schließt einen Bug aus, bei dem das gepushte Layer-Set ein
      # anderes als das lokal gebaute ist).
      #
      # ZWEI STUFEN pro Image — analog zum bewährten fs-Scan in security.yml:
      #   Stufe 1 REPORT  format=sarif, exit-code=0  -> Security-Tab
      #   Stufe 2 GATE    format=table, exit-code=1  -> bricht den Deploy ab
      #
      # Warum getrennt: Mit format=sarif setzt die Action den Exit-Code
      # unabhängig von `severity`, auch wenn limit-severities-for-sarif=true
      # gesetzt ist (der Log zeigt korrekt "Building SARIF report", nicht
      # "...with all severities"). Ergebnis war exit 1 OHNE jedes Finding:
      # Trivy meldete "Detecting vulnerabilities... pkg_num=18" und brach ab,
      # ohne eine einzige Vulnerability-Tabelle auszugeben. Das blockierte
      # fünf Staging-Deploys in Folge, obwohl 0 CRITICAL im Image sind
      # (einziger Image-Alert: CVE-2026-59873, node-tar, HIGH).
      # Das table-Gate respektiert `severity` zuverlässig — genau so läuft
      # der CRITICAL-Gate-Step in security.yml seit jeher grün.
      - name: Scan backend image with Trivy (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          # Default-Timeout (5m) reicht beim grossen node_modules-Baum nicht und
          # führte zu `context deadline exceeded` (Exit 1, kein echtes Finding).
          timeout: "15m"
          format: "sarif"
          output: "trivy-backend.sarif"
          limit-severities-for-sarif: true

      - name: Backend image CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          timeout: "15m"
          format: "table"

      - name: Scan frontend image with Trivy (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          timeout: "15m"
          format: "sarif"
          output: "trivy-frontend.sarif"
          limit-severities-for-sarif: true

      - name: Frontend image CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          timeout: "15m"
          format: "table"

      - name: Upload backend image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: "trivy-backend.sarif"
          category: "trivy-image-backend"

      - name: Upload frontend image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: "trivy-frontend.sarif"
          category: "trivy-image-frontend"

  migrate:
    name: Run DB Migrations
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.build.outputs.has_kubeconfig == 'true'
    permissions:
      contents: read
      packages: read # GITHUB_TOKEN darf die privaten GHCR-Images pullen (Fallback)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      # Ohne diesen Secret kann der Cluster die privaten GHCR-Images nicht
      # ziehen (ImagePullBackOff). Bei jedem Deploy frisch erzeugt, damit ein
      # abgelaufenes Token sich selbst heilt.
      #  - Bevorzugt GHCR_PULL_TOKEN (langlebiger classic PAT mit read:packages):
      #    überlebt Pod-Neustarts/Scale-ups auch zwischen Deploys.
      #  - Fällt sonst auf den eingebauten GITHUB_TOKEN zurück (job hat
      #    packages:read). Funktioniert für diesen Deploy-Run, läuft aber nach
      #    Workflow-Ende ab — für restart-resiliente Pulls den PAT hinterlegen.
      - name: Ensure GHCR image pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -n "$GHCR_PULL_TOKEN" ]; then
            TOKEN="$GHCR_PULL_TOKEN"
            USERNAME="$IMAGE_OWNER"
          else
            echo "::warning::GHCR_PULL_TOKEN not set — using the ephemeral GITHUB_TOKEN. Pulls work for this deploy but the token expires when the run ends; add a read:packages PAT as GHCR_PULL_TOKEN for restart-resilient pulls."
            TOKEN="$GITHUB_TOKEN"
            USERNAME="$ACTOR"
          fi
          OWNER_LC=$(echo "$USERNAME" | tr '[:upper:]' '[:lower:]')
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="$OWNER_LC" \
            --docker-password="$TOKEN" \
            -n "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -n "$NAMESPACE" -f -
          echo "::notice::ghcr-secret ensured in $NAMESPACE"

      # Wie in deploy-production.yml: der Migration-Job zieht `backend-config`
      # und `backend-secrets` per envFrom und muss sie im Cluster vorfinden.
      # Der Sync im deploy-Job weiter unten laeuft erst nach der Migration —
      # auf einem frischen Namespace waere das zu spaet.
      #
      # Nur ConfigMaps/Secrets, nicht das ganze Overlay: dessen Deployments
      # tragen den Base-Image-Tag, der erst im deploy-Job per `set image`
      # gesetzt wird.
      - name: Sync config & secrets (required by the migration job)
        run: |
          set -euo pipefail
          kubectl kustomize k8s/staging > /tmp/staging-rendered.yaml
          python3 - <<'PY' > /tmp/staging-config.yaml
          import re
          docs = open('/tmp/staging-rendered.yaml').read().split('\n---\n')
          keep = [d for d in docs
                  if re.search(r'^kind:\s*(ConfigMap|Secret|SealedSecret)\s*$', d, re.M)]
          print('\n---\n'.join(keep))
          PY
          kubectl apply -n "$NAMESPACE" -f /tmp/staging-config.yaml
          echo "::notice::ConfigMaps/Secrets synced into $NAMESPACE"

          if ! kubectl get configmap backend-config -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "::error::configmap/backend-config missing in $NAMESPACE after sync — check k8s/staging overlay"
            exit 1
          fi
          # Das Overlay liefert `backend-secrets` als SealedSecret; das echte
          # Secret entsteht erst durch den sealed-secrets-Controller, asynchron.
          for i in $(seq 1 30); do
            if kubectl get secret backend-secrets -n "$NAMESPACE" >/dev/null 2>&1; then
              echo "::notice::secret/backend-secrets available"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::secret/backend-secrets not created within 60s — SealedSecret not decrypted? Check the sealed-secrets controller."
              kubectl describe sealedsecret backend-secrets -n "$NAMESPACE" 2>&1 | tail -20 || true
              exit 1
            fi
            sleep 2
          done

      - name: Apply migration job
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          # IMAGE_TAG = vollständiger SHA (matched das gepushte Image).
          # JOB_NAME_SUFFIX = gekürzt, weil k8s-Job-Namen max. 63 Zeichen.
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Ohne pipefail verschluckt die Pipeline einen fehlgeschlagenen
          # `kubectl apply` und der Loop unten wartet bis zum Timeout.
          set -euo pipefail
          export IMAGE_OWNER=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
          JOB_NAME_SUFFIX=$(echo "$IMAGE_TAG" | cut -c1-12)
          JOB_NAME="migrate-${JOB_NAME_SUFFIX}"
          export JOB_NAME_SUFFIX

          # Jobs sind immutable — ein Rest aus einem abgebrochenen Run wuerde
          # `apply` scheitern lassen.
          if kubectl get job "$JOB_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "::warning::Job $JOB_NAME already exists — deleting it before re-applying"
            kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --wait=true --timeout=60s
          fi

          envsubst < k8s/base/jobs/migrate-job.yaml | kubectl apply -n "$NAMESPACE" -f -

          echo "Waiting for $JOB_NAME to complete…"
          for i in $(seq 1 60); do
            COMPLETE=$(kubectl get job "$JOB_NAME" -n "$NAMESPACE" \
              -o 'jsonpath={.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || echo "")
            FAILED=$(kubectl get job "$JOB_NAME" -n "$NAMESPACE" \
              -o 'jsonpath={.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || echo "")
            if [ "$COMPLETE" = "True" ]; then
              echo "::notice::Migrations applied"
              kubectl logs -n "$NAMESPACE" "job/$JOB_NAME" --tail=50 || true
              exit 0
            fi
            if [ "$FAILED" = "True" ]; then
              echo "::error::Migration job failed"
              kubectl logs -n "$NAMESPACE" "job/$JOB_NAME" --tail=200 || true
              exit 1
            fi

            # Startet der Pod gar nicht erst, meldet der Job weder Complete noch
            # Failed — ohne diese Auswertung liefe das stumm in den Timeout.
            POD_STATE=$(kubectl get pods -n "$NAMESPACE" \
              -l "job-name=$JOB_NAME" \
              -o 'jsonpath={.items[*].status.containerStatuses[*].state.waiting.reason}' 2>/dev/null || echo "")
            case "$POD_STATE" in
              *CreateContainerConfigError*|*ImagePullBackOff*|*ErrImagePull*|*CrashLoopBackOff*|*InvalidImageName*)
                echo "::error::Migration pod cannot start: $POD_STATE"
                kubectl describe pods -n "$NAMESPACE" -l "job-name=$JOB_NAME" 2>&1 | tail -30
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::Timeout waiting for migration job"
          kubectl describe pods -n "$NAMESPACE" -l "job-name=$JOB_NAME" 2>&1 | tail -30 || true
          kubectl logs -n "$NAMESPACE" "job/$JOB_NAME" --tail=200 || true
          exit 1

  deploy:
    name: Deploy to Staging
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      # GitOps-Sync: ConfigMaps/Secrets/Manifeste auf den Repo-Stand bringen,
      # BEVOR das Image gepinnt wird. Bisher deployte der Workflow nur das Image
      # (set image), wodurch Config-/Secret-Änderungen nie ankamen — genau so
      # blieb DB_SYNCHRONIZE=true im Cluster und liess jeden neuen Pod im Boot
      # crashen. `apply -k` ist idempotent; das Deployment erhält hier kurz den
      # Base-:latest-Tag, der direkt danach von `set image` auf den exakten SHA
      # überschrieben wird.
      - name: Sync manifests (kustomize)
        run: kubectl apply -k k8s/staging

      - name: Deploy to staging
        run: |
          kubectl set image deployment/backend \
            backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -n "$NAMESPACE"
          kubectl set image deployment/frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -n "$NAMESPACE"

      - name: Wait for rollout
        id: rollout
        run: |
          set -e
          kubectl rollout status deployment/backend -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=300s

      # Bei Rollout-Timeout den Cluster-Zustand dumpen, BEVOR der Rollback
      # (nächster Step) den hängenden Pod samt Events wegräumt. Jeder Befehl
      # mit `|| true`, damit die Diagnose selbst nie den Job abbricht.
      # Zielt auf den beobachteten "old replicas pending termination"-Hänger:
      # deletionTimestamp+finalizers zeigen einen stuck-Terminating-Pod,
      # Node-Status einen NotReady-Node, Events den Eviction-/Kill-Grund.
      - name: Diagnose on rollout failure
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          echo "::group::Pods (wide)"
          kubectl get pods -n "$NAMESPACE" -o wide || true
          echo "::endgroup::"

          echo "::group::ReplicaSets"
          kubectl get rs -n "$NAMESPACE" -o wide || true
          echo "::endgroup::"

          echo "::group::Deployment backend (describe)"
          kubectl describe deployment/backend -n "$NAMESPACE" || true
          echo "::endgroup::"

          echo "::group::Backend pods (describe — Events, State, Conditions)"
          kubectl describe pods -n "$NAMESPACE" -l app=backend || true
          echo "::endgroup::"

          echo "::group::Terminating-Check (deletionTimestamp / finalizers / phase)"
          kubectl get pods -n "$NAMESPACE" -l app=backend \
            -o jsonpath='{range .items[*]}{.metadata.name}{"  deletionTimestamp="}{.metadata.deletionTimestamp}{"  finalizers="}{.metadata.finalizers}{"  phase="}{.status.phase}{"\n"}{end}' || true
          echo ""
          echo "::endgroup::"

          echo "::group::Recent events (last 60)"
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp 2>/dev/null | tail -60 || true
          echo "::endgroup::"

          echo "::group::Nodes (wide + conditions)"
          kubectl get nodes -o wide || true
          kubectl describe nodes | grep -A6 -iE "^Name:|Conditions:|MemoryPressure|DiskPressure|Ready " || true
          echo "::endgroup::"

          echo "::group::PodDisruptionBudgets"
          kubectl get pdb -n "$NAMESPACE" -o wide || true
          echo "::endgroup::"

          echo "::group::Backend pod logs (current + previous)"
          for p in $(kubectl get pods -n "$NAMESPACE" -l app=backend -o name 2>/dev/null); do
            echo "--- $p (current, tail 60) ---"
            kubectl logs -n "$NAMESPACE" "$p" --tail=60 || true
            echo "--- $p (previous, tail 60) ---"
            kubectl logs -n "$NAMESPACE" "$p" --tail=60 --previous || true
          done
          echo "::endgroup::"

      - name: Rollback on rollout failure
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          echo "::warning::Rollout failed — rolling back deployments"
          kubectl rollout undo deployment/backend -n "$NAMESPACE" || true
          kubectl rollout undo deployment/frontend -n "$NAMESPACE" || true

      # Health-Check gegen die öffentliche Staging-URL — verifiziert, dass der
      # neue Stand wirklich Requests beantwortet (nicht nur „Pods Ready").
      - name: Smoke test
        id: smoke
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.colibri-app.ch/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging smoke test failed! HTTP status: $STATUS"
            exit 1
          fi
          echo "::notice::Staging smoke test passed (HTTP $STATUS)"

      - name: Rollback on smoke test failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Smoke test failed — rolling back"
          kubectl rollout undo deployment/backend -n "$NAMESPACE" || true
          kubectl rollout undo deployment/frontend -n "$NAMESPACE" || true
          exit 1

      # Promotion-Anker: das jetzt auf Staging laufende Image-Paar zusätzlich
      # als ':staging-current' taggen. deploy-production.yml liest diesen Tag,
      # wenn der Operator keinen expliziten image_tag angibt.
      # `docker buildx imagetools create` kopiert nur das Manifest (kein Re-Pull
      # der Layer) und ist tag-only.
      - name: Log in to GHCR for tagging
        if: steps.smoke.outcome == 'success'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images as staging-current
        if: steps.smoke.outcome == 'success'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.BACKEND_IMAGE }}:staging-current \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker buildx imagetools create \
            --tag ${{ env.FRONTEND_IMAGE }}:staging-current \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          echo "::notice::Tagged ${{ github.sha }} as staging-current"
