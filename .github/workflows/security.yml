name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Täglich 03:00 UTC — fängt frische CVEs in Dependencies auf.
    - cron: "0 3 * * *"

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blockt PRs, die Dependencies mit bekannten Vulnerabilities (>= high)
  # einführen — prüft den Diff der Manifeste, nicht den ganzen Baum
  # (Komplement zu pnpm audit, das den Ist-Zustand prüft).
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Muss mit pnpm.auditConfig.ignoreGhsas in package.json synchron
          # bleiben — die beiden Checks lesen getrennte Konfigurationen, eine
          # Ausnahme nur an einer Stelle lässt die andere rot laufen.
          # Volle Begründung beim "Audit production dependencies"-Step unten.
          allow-ghsas: GHSA-mh99-v99m-4gvg

  gitleaks:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history damit gitleaks auch alte Commits scannt.
          # Auf großen Repos später auf depth: 50 begrenzen, hier reicht 0.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free / OSS-Mode: kein Lizenz-Token nötig.
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true

  trivy-fs:
    name: Filesystem Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stufe 1 — REPORT: CRITICAL + HIGH ins GitHub-Security-Tab.
      # Blockt NICHT (exit-code 0), damit bekannte, nicht ohne Breaking-Change
      # fixbare transitive HIGH-CVEs (z. B. immutable < 4.3.8 via graphql-codegen,
      # siehe MEMORY.md) den Build nicht dauerhaft rot färben. Sichtbar bleiben sie.
      - name: Run Trivy filesystem scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          # Scope: Manifests + Lockfiles + Dockerfiles + IaC. Findet:
          # - npm/pnpm Vulnerabilities (auch transitive)
          # - K8s-Manifest-Misconfigs (privileged, runAsRoot, etc.)
          # - Dockerfile-Issues (latest-Tag, COPY chown, USER root)
          scanners: "vuln,misconfig,secret"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-fs-results.sarif"

      - name: Upload Trivy scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-fs"

      # Stufe 2 — GATE: fixbare CRITICAL brechen den Build ab.
      # Nutzt den lokalen Trivy-Cache aus Stufe 1 (kein erneuter DB-Download).
      # Akzeptierte Findings via .trivyignore (CVE-ID + Begründung) ausblenden.
      - name: Trivy filesystem scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,misconfig,secret"
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          format: "table"

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Production deps strikt: HIGH+ failed den Build.
      #
      # Bewusste Ausnahme in package.json → pnpm.auditConfig.ignoreGhsas:
      #   GHSA-mh99-v99m-4gvg (brace-expansion, DoS via unbounded expansion)
      # Betrifft in --prod nur zwei transitive Pfade:
      #   apps/backend > typeorm > glob@10 > minimatch@9 > brace-expansion@2.1.4
      #   apps/mobile  > expo > @expo/cli > … > minimatch@3 > brace-expansion@1.1.18
      # Beide sind bereits die gepatchten Spitzen ihrer Major-Linie (v1: >=1.1.16,
      # v2: >=2.1.2); die Advisory-Range <=5.0.7 erfasst sie nur formal. Ein echter
      # Fix verlangt brace-expansion@>=5.0.8, was minimatch@10 und damit glob@13
      # voraussetzt — minimatch@9 deklariert "brace-expansion": "^2.0.2",
      # minimatch@3 deklariert "^1.1.7". Ein Override auf v5 bräche also den
      # Semver-Kontrakt fremder Transitiv-Deps in der Datenschicht (TypeORM).
      # Nicht ausnutzbar: der Glob-Matcher sieht zur Laufzeit keinen
      # Angreifer-Input. Neu bewerten, sobald typeorm auf glob@13 geht.
      #
      # Dieselbe GHSA muss auch bei dependency-review (allow-ghsas, oben)
      # eingetragen sein: der Check bewertet den Lockfile-Diff und meldet die
      # angehobene brace-expansion-Version sonst als neu eingeführte Vuln.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: false

      # Dev-deps: nur reporten, nicht failen — sonst blockieren Vitest/ESLint
      # Transitive-CVEs jedes Update.
      - name: Audit all dependencies (report only)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true
