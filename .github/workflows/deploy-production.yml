name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (commit SHA). Leer lassen → promotet, was aktuell auf Staging läuft."
        required: false
        default: ""
      skip_migrations:
        description: "Skip DB migration job (NUR im Notfall — überspringen führt zu Schema-Drift)"
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/restart-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/restart-frontend
  NAMESPACE: restart-production
  STAGING_NAMESPACE: restart-staging

# Serialisiert Prod-Deploys — verhindert, dass zwei parallele Promotions
# überlappende Rollouts fahren und den Cluster in einen inkonsistenten Zustand
# bringen. Nicht abbrechen, damit ein laufender Migrate/Rollout sauber endet.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve & Validate Promotion Target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      current_prod_tag: ${{ steps.current.outputs.current_prod_tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Volle History für `git log` im Promotion-Summary.
          fetch-depth: 0

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      # Dieser Job liest NUR aus Staging (welcher SHA läuft dort?) und braucht
      # deshalb das Staging-kubeconfig. Der Prod-Zugang liegt bewusst in einem
      # separaten Secret (KUBE_CONFIG_PRODUCTION), das erst die Jobs `migrate`
      # und `deploy` verwenden — Staging und Production sind getrennte Cluster,
      # ein Lookup-Fehler hier kann Production also nicht anfassen.
      - name: Configure kubeconfig (staging — read-only lookup)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      # Auto-Resolve: wenn der Operator keinen image_tag (oder den Alias
      # 'latest'/'staging') angibt, ziehen wir die SHA, die JETZT auf Staging
      # läuft — das ist die einzige verlässliche "was wurde getestet" Aussage.
      - name: Resolve target image tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -e
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ] || [ "$TAG" = "staging" ]; then
            echo "::notice::Resolving from staging cluster ($STAGING_NAMESPACE/backend)…"
            IMAGE=$(kubectl get deployment backend -n "$STAGING_NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            TAG="${IMAGE##*:}"
            if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
              echo "::error::Staging-Deployment trägt keinen pinned SHA-Tag (gefunden: '$TAG'). Promotion abgebrochen."
              exit 1
            fi
          fi
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "::notice::Promotion target: $TAG"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Vorab-Validierung: beide Images müssen in GHCR existieren, sonst
      # bricht der migrate-Job mitten im Apply mit unklarer Fehlermeldung ab.
      - name: Validate images exist in GHCR
        env:
          TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          set -e
          for IMG in "${{ env.BACKEND_IMAGE }}" "${{ env.FRONTEND_IMAGE }}"; do
            if ! docker buildx imagetools inspect "$IMG:$TAG" > /dev/null 2>&1; then
              echo "::error::Image nicht in GHCR gefunden: $IMG:$TAG"
              exit 1
            fi
            echo "::notice::OK $IMG:$TAG"
          done

      # Ab hier wird der PRODUCTION-Cluster gelesen — eigenes kubeconfig in eine
      # separate Datei, damit das Staging-Config oben unangetastet bleibt.
      - name: Configure kubeconfig (production)
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config-production
          chmod 600 $HOME/.kube/config-production

      # Aktuell auf Produktion laufende SHA für den Diff.
      - name: Read current production tag
        id: current
        env:
          KUBECONFIG: /home/runner/.kube/config-production
        run: |
          IMAGE=$(kubectl get deployment backend -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
          CURRENT_TAG="${IMAGE##*:}"
          if [ -z "$CURRENT_TAG" ]; then
            CURRENT_TAG="(none)"
          fi
          echo "current_prod_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "::notice::Current production: $CURRENT_TAG"

      # Promotion-Summary in den Step-Summary-Tab schreiben (oben im UI sichtbar).
      - name: Write promotion summary
        env:
          TARGET: ${{ steps.resolve.outputs.image_tag }}
          CURRENT: ${{ steps.current.outputs.current_prod_tag }}
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations }}
        run: |
          {
            echo "## 🚀 Production Promotion"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Target SHA** | \`$TARGET\` |"
            echo "| **Current Prod SHA** | \`$CURRENT\` |"
            echo "| **Operator** | @${{ github.actor }} |"
            echo "| **Migrations** | $([ "$SKIP_MIGRATIONS" = "true" ] && echo "⚠️ SKIPPED" || echo "Will run") |"
            echo ""
            if [ "$CURRENT" = "$TARGET" ]; then
              echo "ℹ️  Target = Current — Promotion ist no-op (rollout wird angestossen, ändert aber nichts)."
            elif [ "$CURRENT" = "(none)" ]; then
              echo "ℹ️  Erstes Deployment — kein Diff vorhanden."
            else
              echo "### Commits between current prod and target"
              echo ""
              # Falls SHAs nicht reachable sind (z.B. force-push gelöscht), nicht abbrechen.
              echo '```'
              git log --oneline --no-decorate "$CURRENT".."$TARGET" 2>/dev/null \
                || echo "(Diff nicht ermittelbar — SHAs nicht in History reachable.)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: Run DB Migrations
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: ${{ !inputs.skip_migrations }}
    permissions:
      contents: read
      packages: read # GITHUB_TOKEN darf die privaten GHCR-Images pullen (Fallback)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      # Production-Cluster (KUBE_CONFIG zeigt auf Staging — hier falsch!).
      - name: Configure kubeconfig (production)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      # Siehe deploy-staging.yml: privater GHCR-Pull braucht ghcr-secret.
      # Bevorzugt GHCR_PULL_TOKEN (langlebiger PAT, read:packages), sonst
      # Fallback auf den eingebauten GITHUB_TOKEN (job hat packages:read).
      # Für Production dringend einen PAT setzen — der GITHUB_TOKEN läuft nach
      # dem Run ab, sodass spätere Pod-Neustarts/Scale-ups sonst nicht pullen.
      - name: Ensure GHCR image pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -n "$GHCR_PULL_TOKEN" ]; then
            TOKEN="$GHCR_PULL_TOKEN"
            USERNAME="$IMAGE_OWNER"
          else
            echo "::warning::GHCR_PULL_TOKEN not set — using the ephemeral GITHUB_TOKEN. For production, add a read:packages PAT as GHCR_PULL_TOKEN so pod restarts/scale-ups keep pulling after the run ends."
            TOKEN="$GITHUB_TOKEN"
            USERNAME="$ACTOR"
          fi
          OWNER_LC=$(echo "$USERNAME" | tr '[:upper:]' '[:lower:]')
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="$OWNER_LC" \
            --docker-password="$TOKEN" \
            -n "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -n "$NAMESPACE" -f -
          echo "::notice::ghcr-secret ensured in $NAMESPACE"

      # Muss VOR dem Migration-Job laufen: der Job zieht `backend-config` und
      # `backend-secrets` per envFrom. Lag der Sync (frueher nur im deploy-Job)
      # dahinter, existierten die Objekte beim allerersten Prod-Deploy noch
      # nicht und der Job blieb in CreateContainerConfigError haengen — ohne
      # Complete- oder Failed-Condition, also stumm bis in den Timeout.
      #
      # Nur ConfigMaps/Secrets applizieren, NICHT das ganze Overlay: dessen
      # Deployments tragen den Base-Image-Tag, der erst im deploy-Job per
      # `set image` auf den Promotion-SHA gepinnt wird. Ein volles `apply -k`
      # wuerde laufende Pods kurzzeitig auf das falsche Image ziehen.
      - name: Sync config & secrets (required by the migration job)
        run: |
          set -euo pipefail
          kubectl kustomize k8s/production > /tmp/prod-rendered.yaml
          python3 - <<'PY' > /tmp/prod-config.yaml
          import re
          docs = open('/tmp/prod-rendered.yaml').read().split('\n---\n')
          keep = [d for d in docs
                  if re.search(r'^kind:\s*(ConfigMap|Secret|SealedSecret)\s*$', d, re.M)]
          print('\n---\n'.join(keep))
          PY
          kubectl apply -n "$NAMESPACE" -f /tmp/prod-config.yaml
          echo "::notice::ConfigMaps/Secrets synced into $NAMESPACE"

          # Fail fast statt spaeter im Timeout: ohne backend-config startet der
          # Migrations-Pod garantiert nicht.
          if ! kubectl get configmap backend-config -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "::error::configmap/backend-config missing in $NAMESPACE after sync — check k8s/production overlay"
            exit 1
          fi
          # Das Overlay liefert `backend-secrets` als SealedSecret; das echte
          # Secret entsteht erst, wenn der sealed-secrets-Controller es
          # entschluesselt — asynchron. Direkt nach dem Apply danach zu fragen
          # waere ein Race, gerade beim allerersten Deploy. Also kurz warten.
          for i in $(seq 1 30); do
            if kubectl get secret backend-secrets -n "$NAMESPACE" >/dev/null 2>&1; then
              echo "::notice::secret/backend-secrets available"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::secret/backend-secrets not created within 60s — SealedSecret not decrypted? Check the sealed-secrets controller."
              kubectl describe sealedsecret backend-secrets -n "$NAMESPACE" 2>&1 | tail -20 || true
              exit 1
            fi
            sleep 2
          done

      - name: Apply migration job
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          RESOLVED_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail
          export IMAGE_OWNER=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
          # migrate-job.yaml erwartet ZWEI Variablen mit genau diesen Namen:
          #   ${JOB_NAME_SUFFIX} → Job-Name (12 Zeichen, k8s-Limit 63)
          #   ${IMAGE_TAG}       → voller SHA im Image-Tag
          # Beide muessen exportiert sein, sonst ersetzt envsubst sie durch
          # Leerstring und der Job heisst "migrate-" (ungueltig nach RFC 1123).
          export IMAGE_TAG="$RESOLVED_TAG"
          export JOB_NAME_SUFFIX=$(echo "$RESOLVED_TAG" | cut -c1-12 | tr '[:upper:]' '[:lower:]')
          JOB_NAME="migrate-${JOB_NAME_SUFFIX}"

          # Ein bereits existierender Job mit gleichem Namen (z.B. aus einem
          # abgebrochenen Run) ist immutable — `apply` wuerde scheitern. Alten
          # Job vorher entfernen, damit ein Re-Run nicht am Namen haengenbleibt.
          if kubectl get job "$JOB_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "::warning::Job $JOB_NAME already exists — deleting it before re-applying"
            kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --wait=true --timeout=60s
          fi

          envsubst < k8s/base/jobs/migrate-job.yaml | kubectl apply -n "$NAMESPACE" -f -

          echo "Waiting for $JOB_NAME to complete…"
          for i in $(seq 1 120); do
            COMPLETE=$(kubectl get job "$JOB_NAME" -n "$NAMESPACE" \
              -o 'jsonpath={.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || echo "")
            FAILED=$(kubectl get job "$JOB_NAME" -n "$NAMESPACE" \
              -o 'jsonpath={.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || echo "")
            if [ "$COMPLETE" = "True" ]; then
              echo "::notice::Production migrations applied"
              kubectl logs -n "$NAMESPACE" "job/$JOB_NAME" --tail=50 || true
              exit 0
            fi
            if [ "$FAILED" = "True" ]; then
              echo "::error::Production migration FAILED — rollout aborted"
              kubectl logs -n "$NAMESPACE" "job/$JOB_NAME" --tail=200 || true
              exit 1
            fi

            # Der Job meldet WEDER Complete NOCH Failed, solange der Pod gar
            # nicht erst startet (CreateContainerConfigError, ImagePullBackOff,
            # Pending). Genau das lief frueher stumm in den Timeout — deshalb den
            # Pod-Status direkt auswerten und mit Klartext abbrechen.
            POD_STATE=$(kubectl get pods -n "$NAMESPACE" \
              -l "job-name=$JOB_NAME" \
              -o 'jsonpath={.items[*].status.containerStatuses[*].state.waiting.reason}' 2>/dev/null || echo "")
            case "$POD_STATE" in
              *CreateContainerConfigError*|*ImagePullBackOff*|*ErrImagePull*|*CrashLoopBackOff*|*InvalidImageName*)
                echo "::error::Migration pod cannot start: $POD_STATE"
                kubectl describe pods -n "$NAMESPACE" -l "job-name=$JOB_NAME" 2>&1 | tail -30
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::Timeout waiting for production migration job"
          kubectl describe pods -n "$NAMESPACE" -l "job-name=$JOB_NAME" 2>&1 | tail -30 || true
          kubectl logs -n "$NAMESPACE" "job/$JOB_NAME" --tail=200 || true
          exit 1

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      # `deployments: write` für den GitHub-Deployment-Record am Ende (Audit).
      # KEIN `contents: write` — wir pushen nichts auf das (branch-protected) main.
      deployments: write
      contents: read
      packages: write
    needs: [resolve, migrate]
    # Damit der Deploy auch dann läuft, wenn migrate übersprungen wurde:
    if: always() && needs.resolve.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      # Production-Cluster (KUBE_CONFIG zeigt auf Staging — hier falsch!).
      - name: Configure kubeconfig (production)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      # GitOps-Sync wie im Staging-Deploy: ConfigMaps/Secrets/Manifeste auf den
      # Repo-Stand bringen, BEVOR das Image gepinnt wird — sonst driften
      # Config/Secrets (z.B. DB_SYNCHRONIZE) ungebremst. `apply -k` ist
      # idempotent; `set image` direkt danach pinnt den exakten Promotion-SHA.
      # HINWEIS: Vor dem ersten echten Prod-Deploy muss k8s/production
      # bootstrapped sein (DB_HOST gesetzt, SealedSecrets einkommentiert),
      # siehe DEPLOYMENT.md — sonst rendert/appliziert dieser Schritt Platzhalter.
      - name: Sync manifests (kustomize)
        run: kubectl apply -k k8s/production

      - name: Deploy to production
        env:
          TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          kubectl set image deployment/backend \
            backend=${{ env.BACKEND_IMAGE }}:${TAG} \
            -n "$NAMESPACE"
          kubectl set image deployment/frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${TAG} \
            -n "$NAMESPACE"

      - name: Wait for rollout
        id: rollout
        run: |
          set -e
          kubectl rollout status deployment/backend -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=300s

      - name: Rollback on rollout failure
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          echo "::error::Production rollout failed — rolling back"
          kubectl rollout undo deployment/backend -n "$NAMESPACE" || true
          kubectl rollout undo deployment/frontend -n "$NAMESPACE" || true
          exit 1

      - name: Smoke test
        id: smoke
        run: |
          sleep 10

          # curl-Exit-Code separat auswerten: bei Transport-Fehlern (TLS, DNS,
          # Connection refused) gibt es KEINEN HTTP-Status, %{http_code} ist
          # dann leer und die Meldung lautete früher nur "HTTP status: ".
          # Genau so ging der TLS-Fehler vom 2026-08-01 unter (Exit 60 =
          # Zertifikat nicht verifizierbar).
          set +e
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 https://restart.colibri-app.ch/api/health 2>/tmp/curl-err)
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Smoke test failed — curl transport error (exit $CURL_EXIT): $(cat /tmp/curl-err)"
            case "$CURL_EXIT" in
              35|51|58|59|60|77|91)
                echo "::error::TLS-Fehler. Zertifikat prüfen: kubectl get certificate,challenge -n $NAMESPACE"
                ;;
              6)  echo "::error::DNS konnte restart.colibri-app.ch nicht auflösen." ;;
              7)  echo "::error::Verbindung abgelehnt — Ingress/Service erreichbar?" ;;
              28) echo "::error::Timeout nach 30s — Backend antwortet nicht." ;;
            esac
            exit 1
          fi

          if [ "$STATUS" != "200" ]; then
            echo "::error::Smoke test failed! HTTP status: $STATUS"
            exit 1
          fi
          echo "::notice::Smoke test passed (HTTP $STATUS)"

      - name: Rollback on smoke test failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Smoke test failed — rolling back"
          kubectl rollout undo deployment/backend -n "$NAMESPACE" || true
          kubectl rollout undo deployment/frontend -n "$NAMESPACE" || true
          exit 1

      # Promotion-Anker für schnellen Rollback / "was läuft gerade?"-Abfragen.
      # Erst NACH erfolgreichem Smoke-Test taggen, damit ':production-current'
      # nicht auf ein kaputtes Image zeigt.
      - name: Log in to GHCR for tagging
        if: steps.smoke.outcome == 'success'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images as production-current
        if: steps.smoke.outcome == 'success'
        env:
          TAG: ${{ needs.resolve.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            --tag ${{ env.BACKEND_IMAGE }}:production-current \
            ${{ env.BACKEND_IMAGE }}:${TAG}
          docker buildx imagetools create \
            --tag ${{ env.FRONTEND_IMAGE }}:production-current \
            ${{ env.FRONTEND_IMAGE }}:${TAG}
          echo "::notice::Tagged $TAG as production-current"

      # Audit-Log: jede erfolgreiche Promotion wird als GitHub-Deployment-Record
      # festgehalten (sichtbar im Deployments-Tab des Repos). Kein Commit/Push
      # auf das branch-protected `main` — der Record trägt Ziel-SHA, Vorgänger,
      # Operator, Migrations-Flag und Run-URL. Promotion-History ergibt sich
      # zusätzlich aus dem `:production-current`-Image-Tag und diesem Run-Log.
      - name: Record promotion as GitHub Deployment
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET: ${{ needs.resolve.outputs.image_tag }}
          PREVIOUS: ${{ needs.resolve.outputs.current_prod_tag }}
          SKIP_MIGRATIONS: ${{ inputs.skip_migrations }}
        with:
          script: |
            const { TARGET, PREVIOUS, SKIP_MIGRATIONS } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const description =
              `prod promotion ${TARGET.slice(0, 12)} (prev ${PREVIOUS}) ` +
              `by @${context.actor}` +
              (SKIP_MIGRATIONS === 'true' ? ' [migrations SKIPPED]' : '');

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              // Ziel-SHA als ref — der Record verweist exakt auf den promoteten Stand.
              ref: TARGET,
              environment: 'production',
              description,
              auto_merge: false,
              required_contexts: [],
              production_environment: true,
              transient_environment: false,
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: 'production',
              environment_url: 'https://restart.colibri-app.ch',
              log_url: runUrl,
              description,
            });

            core.notice(`Promotion als Deployment #${deployment.data.id} festgehalten: ${description}`);
