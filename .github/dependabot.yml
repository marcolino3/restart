version: 2
updates:
  # Root workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # One grouped PR for all minor+patch (dev + prod) to keep PR volume low.
    # Majors still open individually so they get manual review.
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      tiptap:
        patterns: ["@tiptap/*"]
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Better Auth 1.7.x requires this exact peer; 0.5 breaks its type contract.
      - dependency-name: "@better-auth/utils"
        versions: [">=0.5.0"]
      # NativeWind (apps/mobile) ist an Tailwind 3 gebunden — Tailwind 4 bricht die JS-Config-Auflösung
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
      # Expo koppelt ab SDK 55 die Paket-Major-Version an die SDK-Nummer
      # (https://expo.dev/changelog/sdk-55). apps/mobile steht auf SDK 54; dort
      # tragen die Pakete noch ihre eigene Versionierung (expo ~54.0.x,
      # expo-localization 17.x, expo-linking 8.x, eslint-config-expo 10.x).
      # Ein 55/56/57er-Paket gehört zu einem anderen SDK und bringt bei nativen
      # Modulen inkompatible Autolinking-/Podspec-Anforderungen mit.
      #
      # Als Familie gesperrt statt paketweise: apps/mobile nutzt 15 expo-*
      # Pakete, und Dependabot öffnete für jedes einen eigenen PR (#219-#221),
      # sobald eines fehlte. Die Grenze >=55.0.0 lässt Patches innerhalb der
      # SDK-54-Reihe durch (z.B. expo ~54.0.35 -> ~54.0.36) und blockt nur den
      # Sprung in eine fremde SDK-Generation.
      #
      # Beim echten SDK-Upgrade zieht `npx expo install --fix` alles gemeinsam
      # nach; Einzel-Bumps von Dependabot sind dafür der falsche Weg.
      - dependency-name: "expo"
        versions: [">=55.0.0"]
      - dependency-name: "expo-*"
        versions: [">=55.0.0"]
      - dependency-name: "@expo/*"
        versions: [">=55.0.0"]
      - dependency-name: "eslint-config-expo"
        versions: [">=55.0.0"]

      # @types/node 26 typisiert Node-26-APIs; CI und Runtime laufen auf Node 22
      # (node-version in ci.yml/security.yml, engines: ">=20").
      - dependency-name: "@types/node"
        versions: [">=26.0.0"]

      # ---------------------------------------------------------------------
      # WICHTIG: Der Root-Eintrag scannt das GESAMTE Monorepo und öffnet PRs,
      # die apps/backend, apps/web, apps/mobile und e2e gleichzeitig anfassen.
      # Ignore-Regeln in den verzeichnis-spezifischen Einträgen unten greifen
      # dafür NICHT — jede bewusste Sperre muss deshalb AUCH hier stehen,
      # sonst kommt das Paket über den Root-Scan wieder herein.
      # ---------------------------------------------------------------------

      # react-native/react/reanimated/worklets sind an die Expo-SDK-54-Matrix
      # gebunden (PR#169). Ein Bump auf 0.86.x / react 19.2.x zieht sie zurück
      # in die SDK-56-Reihe und bricht das Bundling (VirtualView-Codegen).
      # Nur gemeinsam über ein echtes SDK-Upgrade + `npx expo install --fix`.
      - dependency-name: "react-native"
        versions: [">=0.82.0"]
      - dependency-name: "react-native-reanimated"
        versions: [">=4.2.0"]
      - dependency-name: "react-native-screens"
        versions: [">=4.17.0"]
      - dependency-name: "react-native-safe-area-context"
        versions: [">=5.7.0"]
      - dependency-name: "react-native-worklets"
        versions: [">=0.6.0"]
      # react/react-dom: ungelöster Zielkonflikt, bewusst NICHT gesperrt.
      #
      # apps/web fährt ^19.2.8 und soll Updates bekommen; apps/mobile muss auf
      # 19.1.0 bleiben (Expo SDK 54). Dependabot kann das im Root-Scan nicht
      # pro Verzeichnis trennen, und ein exakter Pin hält es NICHT ab — #233
      # schlug 19.2.8 vor, obwohl apps/mobile auf "19.1.0" stand.
      #
      # Ein Root-Ignore würde apps/web dauerhaft von React-Updates
      # abschneiden, was schlechter wäre. Deshalb bleibt die Regel offen und
      # solche PRs werden manuell abgelehnt — der Mobile-Typecheck fängt einen
      # versehentlichen Merge (react 19.2 gegen SDK 54 bricht das Bundling).
      # Sauber lösbar erst mit einem eigenen dependabot-Eintrag für
      # /apps/mobile, der die Root-Gruppe für dieses Verzeichnis ersetzt.

      # Siehe /apps/backend bzw. /apps/web für die ausführliche Begründung.
      # Diese Liste muss jede dortige Sperre spiegeln — der Root-Scan kennt
      # die verzeichnis-spezifischen Einträge nicht.
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      - dependency-name: "typeorm"
        versions: [">=1.0.0"]
      - dependency-name: "graphql"
        versions: [">=16.14.1"]
      - dependency-name: "class-validator"
        versions: [">=0.15.0"]
      - dependency-name: "@swc/cli"
        versions: [">=0.8.0"]
      - dependency-name: "@graphql-codegen/cli"
        versions: [">=7.0.0"]
      # ESLint 10 blockiert an eslint-plugin-react@7.37.5, das die in v10
      # entfernte Kontext-API aufruft. Die Sperre muss die ganze Familie
      # umfassen: @eslint/js und @eslint/eslintrc folgen der ESLint-Major,
      # und ein PR auf @eslint/js allein (#237) zieht die v10-Typen herein,
      # ohne dass die eslint-Regel greift.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/*"
        versions: [">=10.0.0"]

  # Backend
  - package-ecosystem: "npm"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps,backend)"
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Bewusste Pins (siehe MEMORY.md „Bekannte Issues")
      - dependency-name: "class-validator"
        versions: [">=0.15.0"]
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      # TypeORM 1.0 = Datenschicht-Major, braucht dedizierten Migrations-PR
      - dependency-name: "typeorm"
        versions: [">=1.0.0"]
      # graphql 17: das Nest/Apollo-Ökosystem ist noch auf 16 festgelegt —
      # @nestjs/graphql und @apollo/server verlangen ^16.11.0, @nestjs/apollo
      # ^16.10.0. Erst nachziehen, wenn diese drei 17 als Peer akzeptieren.
      # graphql 17: das Nest/Apollo-Ökosystem ist noch auf 16 festgelegt.
      # graphql >=16.14.1: bricht den Web-Build. packages/shared-types liefert
      # rohe .ts-Quellen ohne Build-Step und hat graphql als peerDependency;
      # ein abweichender graphql-Stand erzeugt einen zweiten, peer-suffigierten
      # Lockfile-Eintrag (…shared-types_graphql@16.14.2), wodurch das Paket
      # doppelt aufgelöst wird und Turbopack die Modul-Zuordnung verliert:
      #   ./…/@restart/shared-types/src/graphql.ts  Unknown module type
      # Reproduziert 2026-07-31: mit Bump 2 shared-types-Einträge + roter Build,
      # ohne Bump 0 Einträge + "Compiled successfully". Erst nachziehen, wenn
      # shared-types einen echten Build-Step bekommt (dist statt src).
      - dependency-name: "graphql"
        versions: [">=16.14.1"]
      # @types/node 26 typisiert Node-26-APIs; CI und Runtime laufen auf Node 22
      # (node-version in ci.yml/security.yml, engines: ">=20").
      - dependency-name: "@types/node"
        versions: [">=26.0.0"]
      # ESLint 10 — gleicher Blocker wie in /apps/web: eslint-plugin-react@7.37.5
      # ist über die geteilte Root-Config beteiligt und bricht auf v10.
      # Das Monorepo hebt ESLint gemeinsam an, nicht paketweise.
      # @eslint/js und @eslint/eslintrc folgen der ESLint-Major mit.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/*"
        versions: [">=10.0.0"]

  # Frontend
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps,web)"
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Bewusste Pins (siehe MEMORY.md „Bekannte Issues")
      # ESLint 10: typescript-eslint@8.65 unterstützt v10 inzwischen, der
      # Blocker ist jetzt eslint-plugin-react@7.37.5 — es ruft die in v10
      # entfernte Kontext-API auf und stirbt mit
      # "TypeError: contextOrFilename.getFilename is not a function"
      # (lokal mit eslint@10.8.0 verifiziert, Lint bricht mit exit 2 ab).
      # Erst nachziehen, wenn eslint-plugin-react v10 unterstützt.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # @eslint/js und @eslint/eslintrc folgen der ESLint-Major mit.
      - dependency-name: "@eslint/*"
        versions: [">=10.0.0"]
      - dependency-name: "@swc/cli"
        versions: [">=0.8.0"]
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      # Codegen 7: Dokument-Parser bricht auf bestehenden TS-Files
      # (Missing initializer in const declaration) — Major braucht eigene Migration
      - dependency-name: "@graphql-codegen/cli"
        versions: [">=7.0.0"]
      # @types/node 26 typisiert Node-26-APIs; CI und Runtime laufen auf Node 22
      # (siehe node-version in ci.yml/security.yml, engines: ">=20").
      # Erst nachziehen, wenn die Node-Baseline angehoben wird.
      - dependency-name: "@types/node"
        versions: [">=26.0.0"]

  # Mobile (Expo SDK 54)
  #
  # Eigener Eintrag, damit apps/mobile seine Sperren nicht länger über den
  # Root-Eintrag durchsetzen muss. Der Root-Scan kann nicht pro Verzeichnis
  # unterscheiden, deshalb hat jede Mobile-Sperre dort bisher auch apps/web
  # und apps/backend mit eingefroren (@better-auth/expo) oder war gar nicht
  # durchsetzbar (react/react-dom: apps/web soll Updates bekommen,
  # apps/mobile muss auf 19.1.0 bleiben).
  #
  # Der Root-Eintrag scannt das Monorepo weiterhin mit; die Sperren dort
  # bleiben bestehen, solange sie Mobile schützen müssen. Sie hier zu
  # wiederholen ist trotzdem richtig, damit dieser Eintrag für sich allein
  # korrekt ist und die Regeln nicht verschwinden, wenn der Root-Eintrag
  # gelockert wird.
  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "mobile"
    commit-message:
      prefix: "chore(deps,mobile)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Better Auth 1.7.x requires this exact peer; 0.5 breaks its type contract.
      - dependency-name: "@better-auth/utils"
        versions: [">=0.5.0"]
      # Expo koppelt ab SDK 55 die Paket-Major an die SDK-Nummer.
      # apps/mobile steht auf SDK 54 — 55+ gehört zu einer fremden
      # SDK-Generation. Upgrade nur gemeinsam via `npx expo install --fix`.
      - dependency-name: "expo"
        versions: [">=55.0.0"]
      - dependency-name: "expo-*"
        versions: [">=55.0.0"]
      - dependency-name: "@expo/*"
        versions: [">=55.0.0"]
      - dependency-name: "eslint-config-expo"
        versions: [">=55.0.0"]
      # An die SDK-54-Matrix gebunden (PR#169) — 0.86.x bricht das Bundling.
      - dependency-name: "react-native"
        versions: [">=0.82.0"]
      - dependency-name: "react-native-reanimated"
        versions: [">=4.2.0"]
      - dependency-name: "react-native-screens"
        versions: [">=4.17.0"]
      - dependency-name: "react-native-safe-area-context"
        versions: [">=5.7.0"]
      - dependency-name: "react-native-worklets"
        versions: [">=0.6.0"]
      # Keep the mobile React SDK constraint separate from web updates.
      - dependency-name: "react"
        versions: [">=19.2.0"]
      - dependency-name: "react-dom"
        versions: [">=19.2.0"]
      # NativeWind ist an Tailwind 3 gebunden — Tailwind 4 bricht die
      # JS-Config-Auflösung.
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
      # graphql >=16.14.1 bricht den Web-Build: packages/shared-types hat
      # graphql als peerDependency und liefert rohe .ts-Quellen; ein
      # abweichender graphql-Stand in irgendeinem Workspace erzeugt einen
      # zweiten, peer-suffigierten Lockfile-Eintrag und Turbopack verliert
      # die Modul-Zuordnung (Details im /apps/backend-Eintrag). Ein Bump im
      # Mobile-Verzeichnis triggert exakt dasselbe — #347 kam prompt, weil
      # diese Sperre hier anfangs fehlte.
      - dependency-name: "graphql"
        versions: [">=16.14.1"]
      # TypeScript wird im Monorepo gemeinsam angehoben, nicht paketweise.
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/*"
        versions: [">=10.0.0"]
      # @types/node 26 typisiert Node-26-APIs; Runtime laeuft auf Node 22/24.
      - dependency-name: "@types/node"
        versions: [">=26.0.0"]

  # E2E
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "e2e"
    commit-message:
      prefix: "chore(deps,e2e)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 im e2e-Package würde die Version aus dem Rest des Monorepos
      # herauslaufen lassen (dort 5.9.x, gepinnt weil typescript-eslint@8 nur
      # "typescript": ">=4.8.4 <6.1.0" unterstützt). Gemeinsam mit dem Monorepo
      # anheben, nicht einzeln — siehe MEMORY.md „Bekannte Issues".
      - dependency-name: "typescript"
        versions: [">=6.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps,ci)"
    groups:
      actions:
        patterns:
          - "*"

  # Docker
  - package-ecosystem: "docker"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Zurich"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps,docker)"
    ignore:
      # Node 25 ist Current, kein LTS. Lokal, CI und die Container laufen
      # bewusst auf 24 LTS (Krypton, Support bis 2027) — vorher klafften die
      # Ebenen auf 20/22/26 auseinander. Ein Bump auf 25 macht das rückgängig
      # und bringt die Laufzeit wieder auf eine Linie ohne Langzeit-Support.
      # Zusammen mit .nvmrc, engines und ci.yml anheben, nicht per Einzel-PR.
      - dependency-name: "node"
        versions: [">=25.0.0"]

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Zurich"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps,docker)"
    ignore:
      # Node 25 ist Current, kein LTS. Lokal, CI und die Container laufen
      # bewusst auf 24 LTS (Krypton, Support bis 2027) — vorher klafften die
      # Ebenen auf 20/22/26 auseinander. Ein Bump auf 25 macht das rückgängig
      # und bringt die Laufzeit wieder auf eine Linie ohne Langzeit-Support.
      # Zusammen mit .nvmrc, engines und ci.yml anheben, nicht per Einzel-PR.
      - dependency-name: "node"
        versions: [">=25.0.0"]

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Zurich"
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "chore(deps,terraform)"
    ignore:
      # Provider-Majors brauchen terraform-plan-Review (CI-blind) — nicht auto-bumpen
      - dependency-name: "hashicorp/helm"
        versions: [">=3.0.0"]
      - dependency-name: "hashicorp/kubernetes"
        versions: [">=3.0.0"]
