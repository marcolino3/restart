apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: restart-production

resources:
  - ../base
  - ingress.yaml
  # SealedSecrets — erzeugt am 2026-08-01 via `./scripts/bootstrap-secrets.sh
  # production` gegen den Prod-Cluster (KaaS 4315). Nur der sealed-secrets-
  # Controller in diesem Cluster kann sie entschlüsseln.
  - sealed-secrets/backend-secrets.yaml
  - sealed-secrets/frontend-secrets.yaml

# Production nutzt die Base-Defaults für HPA (min 2 / max 5) und PDB (minAvailable 1).
# Die Deployment.replicas in der Base sind der Startwert; HPA übernimmt danach.

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - NODE_ENV=production
      # postgres-production (Infomaniak, Projekt PCP-TPSZANM, az-2).
      # Private Cluster-IP — aus beiden Worker-Nodes verifiziert erreichbar.
      # Die Floating-IP 179.237.73.82 funktioniert hier NICHT: Pod-Egress läuft
      # über NAT und wird von der Security-Group (5432 nur ab 172.21.0.0/16)
      # abgewiesen. Die Floating-IP ist ausschliesslich für SSH-Admin-Zugriff.
      - DB_HOST=172.21.2.249
      # Schema nur über Migrationen; synchronize ist per app.module-Guard
      # in production zusätzlich hart gesperrt.
      - DB_SYNCHRONIZE=false
      - ALLOWED_ORIGINS=https://restart.colibri-app.ch
      # NICHT der Login-Callback: der Google-Login laeuft ueber better-auth
      # (auth.ts::socialProviders.google, ohne redirectURI-Override) und landet
      # auf ${BETTER_AUTH_URL}/api/auth/callback/google. Dieser Wert hier wird
      # nur von google-calendar.service.ts fuer den Kalender-OAuth gelesen.
      - GOOGLE_AUTH_REDIRECT_URI=https://restart.colibri-app.ch/api/auth/google/callback
      - AUTH_UI_REDIRECT=https://restart.colibri-app.ch
      - LOG_LEVEL=info
