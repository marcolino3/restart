apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restart-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # HTTPS erzwingen.
    #
    # TEMPORÄR: 'force-ssl-redirect' ist ausgesetzt, bis cert-manager das erste
    # Let's-Encrypt-Zertifikat für restart.colibri-app.ch ausgestellt hat.
    #
    # Grund — Henne-Ei-Problem beim HTTP-01-Solver: force-ssl-redirect greift
    # auch OHNE gültiges Zertifikat. Let's Encrypt ruft
    # http://restart.colibri-app.ch/.well-known/acme-challenge/<token> über
    # Port 80 ab, bekommt ein 308 auf HTTPS, trifft dort das selbstsignierte
    # nginx-Fallback und bricht ab. Challenge scheitert → kein Zertifikat →
    # Fallback bleibt. Der Prod-Smoke-Test lief deshalb in curl-Exit 60
    # (Verifikation 2026-08-01: der acme-challenge-Pfad antwortete mit 308).
    #
    # 'ssl-redirect: true' bleibt aktiv: sobald das Zertifikat steht, wird
    # weiterhin auf HTTPS umgeleitet. Nach erfolgreicher Ausstellung
    # (kubectl get certificate production-tls -n restart-production → READY=True)
    # muss force-ssl-redirect wieder auf "true" — HSTS ist bereits scharf.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # Body-Size für Uploads.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Rate-Limit in Production schärfer als staging — Schul-Software hat
    # vorhersagbare Last-Profile (kein Web-Crawler-Traffic gewünscht).
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-rpm: "1200"
    nginx.ingress.kubernetes.io/limit-connections: "30"
    # Security-Header.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=(), payment=(), usb=()";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - restart.colibri-app.ch
      secretName: production-tls
  rules:
    - host: restart.colibri-app.ch
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
