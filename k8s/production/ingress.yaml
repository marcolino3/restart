apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restart-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # HTTPS erzwingen.
    #
    # TEMPORÄR: 'ssl-redirect' UND 'force-ssl-redirect' sind ausgesetzt, bis
    # cert-manager das erste Let's-Encrypt-Zertifikat für
    # restart.colibri-app.ch ausgestellt hat.
    #
    # Grund — Henne-Ei-Problem beim HTTP-01-Solver: 'ssl-redirect: "true"'
    # erzwingt den HTTP→HTTPS-Redirect bereits allein, sobald ein tls-Block
    # mit secretName existiert — unabhängig von 'force-ssl-redirect'. Let's
    # Encrypt ruft http://restart.colibri-app.ch/.well-known/acme-challenge/<token>
    # über Port 80 ab, bekommt (auch mit force-ssl-redirect=false) ein 308 auf
    # HTTPS, trifft dort das selbstsignierte nginx-Fallback und bricht ab.
    # Challenge scheitert → kein Zertifikat → Fallback bleibt. Der
    # Prod-Smoke-Test lief deshalb in curl-Exit 60 (Verifikation 2026-08-01,
    # direkt gegen den korrekten Prod-Cluster: der acme-challenge-Pfad
    # antwortete mit 308, obwohl force-ssl-redirect bereits "false" war).
    #
    # Nach erfolgreicher Ausstellung
    # (kubectl get certificate production-tls -n restart-production → READY=True)
    # müssen BEIDE Annotationen wieder auf "true" — HSTS ist bereits scharf.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    # Body-Size für Uploads.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Rate-Limit in Production schärfer als staging — Schul-Software hat
    # vorhersagbare Last-Profile (kein Web-Crawler-Traffic gewünscht).
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-rpm: "1200"
    nginx.ingress.kubernetes.io/limit-connections: "30"
    # Security-Header werden in Next.js gesetzt (apps/web/next.config.ts),
    # NICHT hier: der nginx-Admission-Webhook lehnt 'configuration-snippet'
    # ab, weil Snippets beliebige nginx-Config-Injection erlauben
    # (CVE-2021-25742). Ein `apply` mit dieser Annotation schlägt hart fehl.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - restart.colibri-app.ch
      secretName: production-tls
  rules:
    - host: restart.colibri-app.ch
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
