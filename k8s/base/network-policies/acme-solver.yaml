# cert-manager erzeugt pro ACME-HTTP01-Challenge kurzlebig einen eigenen Pod
# (Label acme.cert-manager.io/http01-solver=true, Name cm-acme-http-solver-*).
# Ohne diese Policy blockt default-deny-all den nginx-Ingress-Controller beim
# Zugriff auf den Solver-Pod — Let's Encrypt bekommt dann nie eine Antwort auf
# den Self-Check (context deadline exceeded), das Zertifikat wird nie
# ausgestellt (Verifikation 2026-08-01, Prod-Cluster: upstream timed out beim
# nginx-Controller-Log für cm-acme-http-solver-*, Endpoint war erreichbar,
# aber keine Policy erlaubte den Zugriff).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-solver-policy
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
